<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>MyDeviceCanvas Inspector</title><style>body{font:16px system-ui;margin:32px;background:#10131a;color:#e8edf5}button{padding:10px 14px;margin-right:8px}pre{background:#1c2330;padding:16px;min-height:180px;white-space:pre-wrap}</style></head>
<body><h1>MyDeviceCanvas</h1><p>Electron uses the public Node SDK in the main process.</p><button id="refresh">Refresh devices</button><button id="dispose">Dispose</button><pre id="output">No devices loaded.</pre><script type="module">const output=document.querySelector("#output");document.querySelector("#refresh").onclick=async()=>{try{output.textContent=JSON.stringify(await window.mdc.devices(),null,2)}catch(error){output.textContent=error.message}};document.querySelector("#dispose").onclick=async()=>{await window.mdc.dispose();output.textContent="Manager disposed."};</script></body></html>
