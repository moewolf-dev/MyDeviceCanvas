[workspace]
members = [
  "crates/mdc-protocol",
  "crates/mdc-transport",
  "crates/mdc-core",
  "crates/mdc-simulator",
  "crates/mdc-discovery",
  "crates/mdc-provision",
  "crates/mdc-assets",
  "tools/mdc-cli",
  "tools/mdc-sim-peer",
  "tools/flasher",
  "tools/inspector",
  "sdk/node/native",
  "sdk/c",
  "examples/rust-hello",
  "examples/tauri-demo",
  "tests/compatibility",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.171", features = ["derive"] }
serde_cbor = "=0.11.2"
thiserror = "=1.0.38"
