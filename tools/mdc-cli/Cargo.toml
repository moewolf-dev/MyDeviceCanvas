[package]
name = "mdc"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mdc"
path = "src/main.rs"

[features]
default = ["serial"]
serial = ["mdc-transport/serial"]
websocket = ["mdc-transport/websocket"]

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[dependencies]
mdc-core = { path = "../../crates/mdc-core" }
mdc-protocol = { path = "../../crates/mdc-protocol" }
mdc-transport = { path = "../../crates/mdc-transport" }
mdc-simulator = { path = "../../crates/mdc-simulator" }
mdc-discovery = { path = "../../crates/mdc-discovery" }
mdc-mirror = { path = "../../crates/mdc-mirror" }
mdc-schedule = { path = "../../crates/mdc-schedule" }
mdc-model = { path = "../../crates/mdc-model" }
mdc-bake = { path = "../../crates/mdc-bake" }
mdc-assets = { path = "../../crates/mdc-assets" }
mdc-flasher = { path = "../flasher" }
mdc-provision = { path = "../../crates/mdc-provision" }
# N530: PPM/BMP are the mirror's own output formats, so `record --play --render`
# can decode them back.
image = { version = "=0.24.9", default-features = false, features = ["png", "jpeg", "webp", "pnm", "bmp"] }
serde = { workspace = true }
serde_json = "=1.0.100"
sha2 = "=0.10.8"
